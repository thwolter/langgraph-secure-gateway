<script>
(() => {
  const agentSelect = document.querySelector('#network-agent-select');
  const agentSelectRow = document.querySelector('[data-agent-discovery]');
  const baseUrlInput = document.querySelector('[name="base_url"]');
  const assistantInput = document.querySelector('[name="assistant_id"]');
  const graphInput = document.querySelector('[name="graph_id"]');
  const nameInput = document.querySelector('[name="name"]');
  const keyInput = document.querySelector('[name="key"]');

  if (!agentSelect || !baseUrlInput) {
    return;
  }

  const agentsEndpointPath = new URL(
    "{{ url_for('admin:view-agent-discovery_agents') }}",
    window.location.href
  ).pathname;
  let loadTimer;

  if (agentSelectRow) {
    const baseUrlRow = baseUrlInput.closest('.form-group, .mb-3, .row');
    if (baseUrlRow && baseUrlRow.parentNode) {
      baseUrlRow.insertAdjacentElement('afterend', agentSelectRow);
    }
  }

  function setOptions(select, options) {
    select.replaceChildren(...options);
  }

  function option(label, value = '') {
    const item = document.createElement('option');
    item.textContent = label;
    item.value = value;
    return item;
  }

  function slugify(value) {
    return value
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 120);
  }

  function agentLabel(agent) {
    const parts = [agent.name, agent.graph_id, agent.assistant_id].filter(Boolean);
    return parts.join(' / ');
  }

  function normalizeBaseUrl(baseUrl) {
    const trimmed = baseUrl.trim().replace(/\/+$/, '');
    return trimmed.replace(/\/(docs|redoc|openapi\.json)$/, '');
  }

  async function loadAgents(baseUrl) {
    const normalizedBaseUrl = normalizeBaseUrl(baseUrl);
    if (!normalizedBaseUrl) {
      setOptions(agentSelect, [option('Enter a base URL first')]);
      agentSelect.disabled = true;
      return;
    }

    setOptions(agentSelect, [option('Loading...')]);
    agentSelect.disabled = true;
    try {
      const params = new URLSearchParams({ base_url: normalizedBaseUrl });
      const requestUrl = new URL(agentsEndpointPath, window.location.origin);
      requestUrl.search = params.toString();
      const response = await fetch(requestUrl, {
        headers: { Accept: 'application/json' },
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const payload = await response.json();
      const agents = Array.isArray(payload.agents) ? payload.agents : [];
      const options = [option('Select an agent')];
      for (const agent of agents) {
        const item = option(agentLabel(agent), JSON.stringify(agent));
        options.push(item);
      }
      if (options.length === 1) {
        options[0].textContent = 'No agents found';
      }
      setOptions(agentSelect, options);
      agentSelect.disabled = options.length === 1;
    } catch {
      setOptions(agentSelect, [option('Agent lookup failed')]);
    }
  }

  function queueAgentLoad() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => {
      loadAgents(baseUrlInput.value);
    }, 350);
  }

  baseUrlInput.addEventListener('input', queueAgentLoad);
  baseUrlInput.addEventListener('change', queueAgentLoad);
  baseUrlInput.addEventListener('blur', () => loadAgents(baseUrlInput.value));

  agentSelect.addEventListener('change', () => {
    if (!agentSelect.value) {
      return;
    }
    const agent = JSON.parse(agentSelect.value);
    if (assistantInput && agent.assistant_id) {
      assistantInput.value = agent.assistant_id;
    }
    if (graphInput && agent.graph_id) {
      graphInput.value = agent.graph_id;
    }
    if (nameInput && !nameInput.value && agent.name) {
      nameInput.value = agent.name;
    }
    if (keyInput && !keyInput.value) {
      keyInput.value = slugify(agent.name || agent.graph_id || agent.assistant_id || '');
    }
  });

  loadAgents(baseUrlInput.value);
})();
</script>
