services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    networks:
      - default
      - gateway-internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      AUTH_DB_AUTO_MIGRATE: ${AUTH_DB_AUTO_MIGRATE:-true}
      GATEWAY_UPSTREAM_SECRET: ${GATEWAY_UPSTREAM_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  gateway-postgres:

networks:
  gateway-internal:
    name: ${GATEWAY_INTERNAL_NETWORK:-gateway-internal}
    external: true
