[project]
name = "langgraph-secure-gateway"
version = "0.6.0"
description = "Reusable auth gateway and deployment tooling for LangGraph apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17.0",
  "bcrypt>=4.0.1,<4.1",
  "fastapi>=0.121.0",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "passlib[bcrypt]>=1.7.4",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.11.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.10",
  "sqladmin>=0.21.0",
  "sqlalchemy>=2.0.44",
  "typer>=0.16.0",
  "uvicorn>=0.38.0",
]

[project.scripts]
secure-langgraph = "langgraph_secure_gateway.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"langgraph_secure_gateway" = ["templates/deploy/*"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "fastapi[standard]>=0.121.0",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "pyrefly>=0.61.0",
    "ruff>=0.15.10",
    "ssort>=0.16.0",
]
